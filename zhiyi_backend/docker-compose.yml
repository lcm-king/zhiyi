# =============================================================================
# 智医 (ZhiYi) — Docker Compose 部署
# 基层医疗AI辅助诊疗平台 · 一键启动全部服务
# =============================================================================
# 使用方法：docker compose up -d

services:
  # ── MySQL 8.0 主数据库 ──────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: zhiyi-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-zhiyi_root_2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zhiyi}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_PASSWORD:-zhiyi_root_2026}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis 7 缓存 ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: zhiyi-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-zhiyi_redis_2026}", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-zhiyi_redis_2026}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── MongoDB 文档数据库 ───────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: zhiyi-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
    environment:
      MONGO_INITDB_DATABASE: zhiyi
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── ChromaDB 向量数据库 ──────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    container_name: zhiyi-chromadb
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      test: ["CMD", "bash", "-c", "echo >/dev/tcp/localhost/8000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── RabbitMQ 消息队列 ────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: zhiyi-rabbitmq
    restart: unless-stopped
    ports:
      - "127.0.0.1:5673:5672"
      - "127.0.0.1:15673:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: zhiyi
      RABBITMQ_DEFAULT_PASS: zhiyi_mq_2026
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Elasticsearch 全文检索 ───────────────────────────────
  elasticsearch:
    image: elasticsearch:8.15.0
    container_name: zhiyi-elasticsearch
    restart: unless-stopped
    ports:
      - "127.0.0.1:9201:9200"
      - "127.0.0.1:9301:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── FastAPI 后端服务 ─────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zhiyi-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      REDIS_URL: redis://:${REDIS_PASSWORD:-zhiyi_redis_2026}@redis:6379/0
      MONGO_URL: mongodb://mongodb:27017/zhiyi
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      RABBITMQ_URL: amqp://zhiyi:zhiyi_mq_2026@rabbitmq:5672/
      ES_HOST: http://elasticsearch:9200
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      chromadb:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./app:/app/app

  # ── Nginx 反向代理 + 前端静态资源 ────────────────────────
  nginx:
    image: nginx:alpine
    container_name: zhiyi-nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../zhiyi_frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
  mongo_data:
  chroma_data:
  rabbitmq_data:
  es_data:
